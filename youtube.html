<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מנקה קישורי יוטיוב - SMT</title>
    <link rel="icon" href="smt.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #e2e8f0 0%, transparent 50%), 
                              radial-gradient(circle at bottom left, #e2e8f0 0%, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-main);
        }

        .card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05), 0 4px 6px rgba(0, 0, 0, 0.05);
            max-width: 450px;
            width: 90%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .logo-container {
            margin-bottom: 25px;
        }

        .logo {
            max-width: 120px;
            height: auto;
            /* מניעת אפשרות גרירה ברמת CSS בנוסף ל-HTML */
            user-drag: none;
            -webkit-user-drag: none;
            user-select: none;
            -moz-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            /* חסימת לחיצה ימנית, פתיחה בכרטיסייה חדשה ואינטראקציה עם העכבר */
            pointer-events: none;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 25px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            direction: ltr;
            transition: all 0.3s ease;
            box-sizing: border-box;
            background-color: #f8fafc;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 500;
            font-family: 'Heebo', sans-serif;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .result-container {
            margin-top: 25px;
            min-height: 80px; /* שומר על גובה כדי למנוע קפיצות במסך */
        }

        .message {
            display: none;
            padding: 12px 15px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 15px;
            animation: fadeIn 0.4s ease-out;
            word-break: break-all;
            direction: ltr;
        }

        .message.success {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: block;
        }

        .message.error {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block;
            direction: rtl;
        }

        .clean-link-text {
            color: #1e293b;
            font-size: 14px;
            margin-top: 10px;
            display: block;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        /* חיווי צף "הועתק ללוח" */
        .toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success-color);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease, top 0.3s ease;
            pointer-events: none;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .toast.show {
            opacity: 1;
            top: 30px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="toast" id="toast">הועתק ללוח! ✓</div>
    
    <div class="logo-container">
        <img src="smt.png" alt="לוגו האתר" class="logo" draggable="false" oncontextmenu="return false;">
    </div>
    
    <h1>יצירת קישור נקי</h1>
    <p>הדבק קישור מסורבל של יוטיוב והוא ינוקה ויועתק אוטומטית ללוח שלך.</p>
    
    <div class="input-group">
        <input type="text" id="youtubeUrl" placeholder="https://www.youtube.com/..." autofocus autocomplete="off">
    </div>
    
    <button onclick="processUrl()" id="actionBtn">נקה והעתק קישור</button>
    
    <div class="result-container">
        <div id="statusMessage" class="message"></div>
    </div>
</div>

<script>
    // תמיכה בלחיצה על 'אנטר'
    document.getElementById('youtubeUrl').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            processUrl();
        }
    });

    function processUrl() {
        const inputField = document.getElementById('youtubeUrl');
        const inputUrl = inputField.value.trim();
        const statusDiv = document.getElementById('statusMessage');
        const toast = document.getElementById('toast');
        
        // איפוס תצוגה
        statusDiv.className = 'message';
        statusDiv.innerHTML = '';

        if (!inputUrl) {
            showError('נא להדביק קישור בשדה הטקסט.');
            inputField.focus();
            return;
        }

        try {
            const url = new URL(inputUrl);
            let videoId = '';

            // חילוץ מזהה הסרטון
            if (url.hostname === 'youtu.be') {
                videoId = url.pathname.substring(1);
            } else if (url.pathname.includes('/embed/')) {
                videoId = url.pathname.split('/embed/')[1];
            } else if (url.pathname.includes('/shorts/')) {
                videoId = url.pathname.split('/shorts/')[1];
            } else if (url.searchParams.has('v')) {
                videoId = url.searchParams.get('v');
            } else if (url.pathname.includes('/live/')) {
                videoId = url.pathname.split('/live/')[1];
            }

            if (videoId) {
                // ניקוי שאריות אם נשארו פרמטרים נוספים מחוברים ל-ID
                videoId = videoId.split('?')[0].split('&')[0];
                const cleanLink = 'https://www.youtube.com/watch?v=' + videoId;
                
                // העתקה ללוח
                navigator.clipboard.writeText(cleanLink).then(() => {
                    // הצלחה
                    statusDiv.className = 'message success';
                    statusDiv.innerHTML = 'הקישור נוקה והועתק בהצלחה!<br><a href="' + cleanLink + '" target="_blank" class="clean-link-text">' + cleanLink + '</a>';
                    
                    // הצגת פופ-אפ צף
                    toast.classList.add('show');
                    setTimeout(() => {
                        toast.classList.remove('show');
                    }, 2500);
                    
                    // ניקוי השדה כדי להיות מוכן לקישור הבא
                    inputField.value = '';
                    inputField.focus();

                }).catch(err => {
                    // במקרה של חסימת הרשאות העתקה בדפדפן
                    statusDiv.className = 'message success';
                    statusDiv.innerHTML = 'הקישור נוקה, אך הדפדפן חסם העתקה אוטומטית:<br><a href="' + cleanLink + '" target="_blank" class="clean-link-text">' + cleanLink + '</a>';
                });

            } else {
                showError('לא מצאנו סרטון חוקי בקישור הזה.');
            }
        } catch (error) {
            showError('הטקסט שהוזן אינו קישור תקין.');
        }
    }

    function showError(msg) {
        const statusDiv = document.getElementById('statusMessage');
        statusDiv.className = 'message error';
        statusDiv.innerText = msg;
    }
</script>

</body>
</html>
