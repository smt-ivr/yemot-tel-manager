<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת צפייה בנתונים - SMT</title>
    <link rel="icon" type="image/png" href="smt.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-bar">
        <div style="display: flex; align-items: center; gap: 20px;">
            <img src="smt.png" alt="SMT Logo" class="top-bar-logo" draggable="false">
            <h1>מערכת צפייה בנתונים</h1>
        </div>
    </div>

    <div class="container-fluid">
        <div class="dashboard-top-controls" id="topControls" style="display: none;">
            <div class="stats-cards">
                <div class="stat-card bordered">
                    <span class="stat-title">סה"כ רשומות במסך</span>
                    <span class="stat-value" id="recordCount">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-title">עודכן לאחרונה</span>
                    <span class="stat-value" style="font-size: 1rem; margin-top: 5px; color: #555;" id="lastUpdate">-</span>
                </div>
            </div>

            <div class="actions-wrapper">
                <div class="search-box">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="globalSearch" placeholder="חיפוש חופשי בכל העמודות..." oninput="applyFilters()">
                </div>
                <button id="refreshBtn" class="btn btn-secondary" onclick="reloadData()">
                    <i id="refreshIcon" class="fa-solid fa-rotate-right"></i> רענן נתונים
                </button>
                <button id="exportBtn" class="btn btn-success" onclick="exportToExcel()">
                    <i class="fa-solid fa-file-excel"></i> הורד אקסל
                </button>
            </div>
        </div>

        <div id="loading" class="text-center" style="display: none; padding: 50px;">
            <i class="fa-solid fa-circle-notch fa-spin fa-3x" style="color: var(--primary-color);"></i>
            <h3 style="margin-top: 20px; color: var(--text-muted);">טוען נתונים, נא להמתין...</h3>
        </div>

        <div id="no-params-msg" class="text-center" style="display: none; padding: 50px;">
            <i class="fa-solid fa-link-slash" style="font-size: 4rem; color: #f39c12; margin-bottom: 20px;"></i>
            <h2>לא קיימים פרמטרי התחברות</h2>
            <p style="color: var(--text-muted); font-size: 1.1rem; margin-top: 10px;">
                יש להיכנס פעם אחת דרך הקישור הישיר שסופק לך.<br>
                לאחר מכן המערכת תזכור את כניסתך.
            </p>
        </div>

        <div id="error-box" style="display: none; background: #ffebee; border: 1px solid #ffcdd2; padding: 20px; border-radius: var(--radius); margin-bottom: 20px;">
            <h3 style="color: #c62828; margin-bottom: 10px;"><i class="fa-solid fa-triangle-exclamation"></i> שגיאה בטעינת הנתונים</h3>
            <textarea id="errorText" readonly style="width: 100%; height: 100px; background: #fff; border: 1px solid #ffcdd2; padding: 10px; font-family: monospace; direction: ltr; text-align: left;"></textarea>
            <div style="margin-top: 10px; text-align: left;">
                <button class="btn btn-secondary" onclick="copyError()"><i class="fa-solid fa-copy"></i> העתק שגיאה</button>
            </div>
        </div>

        <div class="table-container" id="tableContainer" style="display: none;">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
